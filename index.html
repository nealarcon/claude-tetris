<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro" title="Cambiar tema">☀</button>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="record-entry" class="record-entry hidden">
          <p class="new-record">¡Nuevo récord!</p>
          <div class="record-form">
            <input id="player-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="save-record-btn" type="button">Guardar</button>
          </div>
        </div>
        <div id="over-records" class="records"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay start-screen">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <span class="label">MEJORES PUNTUACIONES</span>
        <div id="start-records" class="records"></div>
        <p id="start-stats" class="records-stats"></p>
        <button id="play-btn" type="button">Jugar</button>
        <button id="reset-records-btn" type="button" class="secondary-btn">Borrar récords</button>
        <p class="records-stats">o pulsa Enter</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
